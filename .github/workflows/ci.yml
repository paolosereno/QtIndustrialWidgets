name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================
  # 0. REUSE / SPDX Compliance Check
  # ============================================================
  reuse-compliance:
    name: REUSE Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # ============================================================
  # 0b. actionlint (#138): every workflow in .github/workflows (syntax, expressions, action inputs) and its run: blocks
  # through shellcheck. Both tools at a fixed version, downloaded from their GitHub releases and checked against
  # the SHA-256 below, so that a new release cannot change the result.
  # ============================================================
  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install actionlint and shellcheck
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum -c
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          ./actionlint -version
          ./shellcheck --version
          echo "$tools" >> "$GITHUB_PATH"

      # shellcheck by its path, so that a shellcheck of the runner image is never used
      - name: actionlint
        run: actionlint -shellcheck "$RUNNER_TEMP/lint-tools/shellcheck"

  # ============================================================
  # 1. Linux (Ubuntu 24.04 LTS - GCC & Qt 6)
  # ============================================================
  build-linux:
    name: Linux (Ubuntu 24.04, GCC, Qt 6)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            doxygen \
            graphviz \
            fonts-ubuntu

      # Warnings are errors in every compiler job (#215). CMAKE_COMPILE_WARNING_AS_ERROR (CMake >= 3.24 at configure
      # time) gives -Werror / /WX; the project does not set it, so a user build is not affected.
      # The benchmarks are built here, so that they are compiled with warnings as errors; they are not run (they
      # are not ctest tests).
      - name: Configure CMake
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DBUILD_DOCS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_DESIGNER_PLUGIN=ON | tee configure.log
          # The test of the installed Designer plugin (#127) runs only when the plugin is built
          grep -q "QtIndustrialWidgets: Qt Designer found, building designer plugin" configure.log

      - name: Build all targets
        run: cmake --build build

      - name: Run unit tests (QtTest)
        run: |
          export QT_QPA_PLATFORM=offscreen
          # #274: the whole output of the tests (ctest -V) goes to a log, so that tools/ci_skips.py checks every skip
          # against tests/expected_skips.json; the console gets the result of each test, and the output of the
          # failing ones
          log="$RUNNER_TEMP/ctest.log"
          status=0
          ctest --test-dir build -V > "$log" 2>&1 || status=$?
          grep -E '^ *[0-9]+/[0-9]+ Test +#|tests passed|tests failed' "$log" || true
          if [ "$status" -ne 0 ]; then
            ctest --test-dir build --rerun-failed --output-on-failure || true
            exit 1
          fi
          python3 tools/ci_skips.py --platform "linux ci" "$log"

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log-linux-ci
          path: ${{ runner.temp }}/ctest.log
          retention-days: 14

      # Smoke test of the documentation image export (#26); images are uploaded, never committed
      - name: Export gallery images (smoke test)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gallery-images"
          ./build/bin/QtIndustrialWidgetsGallery --export-gallery "$out" --theme both | tee "$RUNNER_TEMP/export.log"
          # every printed file exists
          while read -r f; do test -s "$f" || { echo "missing: $f"; exit 1; }; done < "$RUNNER_TEMP/export.log"
          # the dark images are exactly the committed docs/images, each with its light variant
          diff <(find "$out" -mindepth 1 -maxdepth 1 ! -name '.*' ! -name '*-light.png' -printf '%f\n' | sort) \
               <(find docs/images -mindepth 1 -maxdepth 1 ! -name '.*' -printf '%f\n' | sort)
          for f in docs/images/*.png; do
            n=$(basename "$f" .png)
            test -s "$out/$n-light.png" || { echo "missing light variant: $n-light.png"; exit 1; }
          done
          echo "$(find "$out" -mindepth 1 -maxdepth 1 ! -name '.*' | wc -l) images exported"

      - name: Upload gallery images artifact
        uses: actions/upload-artifact@v7
        with:
          name: gallery-images
          path: ${{ runner.temp }}/gallery-images/
          retention-days: 14

      # docs/images must be the export of this commit (#103): a PR that changes what the gallery draws must re-export
      # it. The gallery's style sheet asks for the Ubuntu font (fonts-ubuntu above), as on the machine that exports
      # the committed images.
      - name: Check that docs/images is up to date
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gallery-images"
          stale=()
          for f in docs/images/*.png; do
            cmp -s "$f" "$out/$(basename "$f")" || stale+=("$(basename "$f")")
          done
          if [ "${#stale[@]}" -gt 0 ]; then
            echo "::error::docs/images is out of date: ${#stale[@]} image(s) differ from the export of this commit"
            printf '  %s\n' "${stale[@]}"
            echo "Regenerate them with './build/bin/QtIndustrialWidgetsGallery --export-gallery docs/images'"
            echo "(docs/gallery_images.md), or take them from the gallery-images artifact of this run."
            exit 1
          fi
          committed=(docs/images/*.png)
          echo "docs/images: all ${#committed[@]} images equal the export"

      # The GitHub Pages site (#80): landing page at the root, Doxygen under api/ with the gallery images,
      # redirect stubs at the old addresses
      - name: Build Doxygen documentation and the Pages site
        run: cmake --build build --target site

      - name: Check the Pages site
        run: python3 tools/check_site.py build/site

      - name: Upload Pages site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site/
          retention-days: 14

  # ============================================================
  # 1b. Linux with Qt 6.2 LTS, the oldest supported Qt (#79)
  # ============================================================
  build-linux-qt62:
    name: Linux (Ubuntu 24.04, GCC, Qt 6.2.4)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - name: Setup Qt 6.2.4
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.2.4'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          cache: true

      # Warnings are errors (#215): see the configure step of the Linux (Qt 6) job.
      - name: Configure CMake
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_DESIGNER_PLUGIN=ON | tee configure.log
          # The job must build against Qt 6.2.4, not another Qt found on the runner
          grep -q "QtIndustrialWidgets: Using Qt 6.2.4" configure.log
          # The test of the installed Designer plugin (#127) runs only when the plugin is built
          grep -q "QtIndustrialWidgets: Qt Designer found, building designer plugin" configure.log

      - name: Build all targets
        run: cmake --build build

      - name: Run unit tests (QtTest)
        run: |
          export QT_QPA_PLATFORM=offscreen
          # #274: the whole output of the tests (ctest -V) goes to a log, so that tools/ci_skips.py checks every skip
          # against tests/expected_skips.json; the console gets the result of each test, and the output of the
          # failing ones
          log="$RUNNER_TEMP/ctest.log"
          status=0
          ctest --test-dir build -V > "$log" 2>&1 || status=$?
          grep -E '^ *[0-9]+/[0-9]+ Test +#|tests passed|tests failed' "$log" || true
          if [ "$status" -ne 0 ]; then
            ctest --test-dir build --rerun-failed --output-on-failure || true
            exit 1
          fi
          python3 tools/ci_skips.py --platform "linux qt6.2 ci" "$log"

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log-linux-qt62-ci
          path: ${{ runner.temp }}/ctest.log
          retention-days: 14

  # ============================================================
  # 1c. Designer plugin installed into Qt's own prefix (#135)
  # ============================================================
  # Qt from aqt, as the online installer lays it out (plugins in <Qt>/plugins): the library installed into that
  # Qt's prefix puts the plugin into Qt's plugin directory, and that Qt's Designer loads it with no QT_PLUGIN_PATH
  # and no LD_LIBRARY_PATH (the plugin finds the library through its run path, #127)
  designer-plugin-qt-prefix:
    name: Designer plugin in Qt's prefix (aqt Qt 6.2.4)
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev

      # No cache: the job installs into this Qt's prefix, which must not be saved for the other jobs
      - name: Setup Qt 6.2.4
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.2.4'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          cache: false

      # Warnings are errors (#215, #245): see the configure step of the Linux (Qt 6) job.
      - name: Configure CMake with the install prefix of Qt
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR" \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DESIGNER_PLUGIN=ON | tee configure.log
          grep -q "QtIndustrialWidgets: Using Qt 6.2.4" configure.log
          grep -F "Designer plugin destination:" configure.log
          grep -qF "Designer plugin destination: plugins/designer (Qt's plugin directory: CMAKE_INSTALL_PREFIX is Qt's prefix)" configure.log

      - name: Build and install into Qt's prefix
        id: install
        run: |
          cmake --build build
          cmake --install build
          plugin=$(realpath "$QT_ROOT_DIR/plugins/designer/QtIndustrialWidgetsPlugin.so")
          test -f "$plugin"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "installed plugin: $plugin"
          echo "qtpaths --plugin-dir: $("$QT_ROOT_DIR/bin/qtpaths" --plugin-dir)"
          readelf -d "$plugin" | grep -E 'RUNPATH|RPATH'

      # Designer scans <plugin dir>/designer; QT_DEBUG_PLUGINS=1 logs every library it loads. install-qt-action sets
      # QT_PLUGIN_PATH (and may set LD_LIBRARY_PATH): both are unset, so only Qt's own plugin directory and the
      # plugin's run path can lead to the plugin and the library
      - name: That Qt's Designer loads the plugin, with no QT_PLUGIN_PATH
        env:
          QT_DEBUG_PLUGINS: "1"
        run: |
          unset QT_PLUGIN_PATH LD_LIBRARY_PATH
          status=0
          timeout 20 "$QT_ROOT_DIR/bin/designer" > designer.log 2>&1 || status=$?
          echo "designer exit status: $status (124: still running after 20 s, stopped by timeout)"
          grep 'designer/.*loaded library\|loaded library.*designer/' designer.log || true
          if ! grep -F "${{ steps.install.outputs.plugin }}" designer.log | grep -q 'loaded library'; then
            echo "::error::Qt Designer did not load ${{ steps.install.outputs.plugin }}"
            grep -F 'QtIndustrialWidgets' designer.log || true
            exit 1
          fi

  # ============================================================
  # 2. Windows (MSVC 2022 & Qt 6)
  # ============================================================
  build-windows:
    name: Windows (MSVC 2022, Qt 6)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'

      # Warnings are errors (#215): see the configure step of the Linux (Qt 6) job. The Designer plugin is built
      # with MSVC too (#245): CMakeLists.txt turns it off with only a message when Qt Designer is not found, so the
      # step fails unless the configure output says it is built
      - name: Configure CMake
        shell: bash
        run: |
          set -o pipefail
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_DESIGNER_PLUGIN=ON | tee configure.log
          grep -qF "QtIndustrialWidgets: Qt Designer found, building designer plugin" configure.log

      - name: Build all targets
        run: cmake --build build --config Release

      # #274: Qt's offscreen platform does not read the fonts of Windows: it reads the folder QT_QPA_FONTDIR (by default
      # <Qt>/lib/fonts, which aqt does not install), and with no font it draws every glyph as a box, so the pixel checks
      # of the glyphs skip. The job gives it DejaVu 2.37, the family of the Linux jobs, from the release of the DejaVu
      # project at a fixed URL; the archive must have the SHA-256 below (the same on the project's SourceForge mirror),
      # else the job fails. It is cached under that SHA-256.
      - name: Cache the fonts for the offscreen platform (#274)
        id: dejavu-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dejavu
          key: dejavu-fonts-ttf-2.37-7576310b219e04159d35ff61dd4a4ec4cdba4f35c00e002a136f00e96a908b0a

      - name: Fonts for the offscreen platform (#274)
        shell: bash
        env:
          DEJAVU_URL: https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip
          DEJAVU_SHA256: 7576310b219e04159d35ff61dd4a4ec4cdba4f35c00e002a136f00e96a908b0a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dejavu/dejavu-fonts-ttf-2.37.zip"
          if [ ! -f "$archive" ]; then
            mkdir -p "$RUNNER_TEMP/dejavu"
            curl -sSLf -o "$archive" "$DEJAVU_URL"
          fi
          # Checked also when the archive comes from the cache
          echo "$DEJAVU_SHA256  $archive" | sha256sum -c -
          dir="$RUNNER_TEMP/qpa-fonts"
          mkdir -p "$dir"
          # The 22 DejaVu files that fc-list shows on the Linux job (ubuntu-24.04), by name: with more or fewer files
          # Qt resolves other faces than on Linux (CI probe of #274)
          for f in DejaVuMathTeXGyre.ttf DejaVuSans.ttf DejaVuSans-Bold.ttf DejaVuSans-BoldOblique.ttf \
                   DejaVuSans-ExtraLight.ttf DejaVuSans-Oblique.ttf DejaVuSansCondensed.ttf DejaVuSansCondensed-Bold.ttf \
                   DejaVuSansCondensed-BoldOblique.ttf DejaVuSansCondensed-Oblique.ttf DejaVuSansMono.ttf \
                   DejaVuSansMono-Bold.ttf DejaVuSansMono-BoldOblique.ttf DejaVuSansMono-Oblique.ttf DejaVuSerif.ttf \
                   DejaVuSerif-Bold.ttf DejaVuSerif-BoldItalic.ttf DejaVuSerif-Italic.ttf DejaVuSerifCondensed.ttf \
                   DejaVuSerifCondensed-Bold.ttf DejaVuSerifCondensed-BoldItalic.ttf DejaVuSerifCondensed-Italic.ttf; do
            unzip -q -o -j "$archive" "dejavu-fonts-ttf-2.37/ttf/$f" -d "$dir"
          done
          test "$(find "$dir" -name '*.ttf' | wc -l)" -eq 22 || { echo "::error::not the 22 DejaVu files"; exit 1; }
          echo "22 fonts in $dir"
          echo "QT_QPA_FONTDIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"

      - name: Probe 274 (LinearGauge labels)
        if: always()
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen QIW_PROBE_LG=1 QT_FORCE_STDERR_LOGGING=1
          mkdir -p "$RUNNER_TEMP/probe274"
          for s in 1 1.25 1.5 2; do
            t="scaleLabelsReadable:horizontal 0-250 at 219x55"; QT_SCALE_FACTOR=$s ./build/bin/Release/tst_LinearGauge.exe "$t" "$t" "$t" "$t" "$t" > "$RUNNER_TEMP/probe274/lg-windows-$s.txt" 2>&1 || true
            grep -E 'PROBE274 widget|FAIL|Totals' "$RUNNER_TEMP/probe274/lg-windows-$s.txt" || true
          done
          for s in 1 1.25 1.5 2; do
            QT_SCALE_FACTOR=$s ./build/bin/Release/tst_LinearGauge.exe > "$RUNNER_TEMP/probe274/lg-windows-full-$s.txt" 2>&1 || true
            grep -E 'PROBE274 widget|FAIL!|Totals' "$RUNNER_TEMP/probe274/lg-windows-full-$s.txt" | cut -c1-400 || true
          done

      - name: Upload probe 274
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe274-lg-windows
          path: ${{ runner.temp }}/probe274/
          retention-days: 14

      - name: Run unit tests (QtTest)
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen
          # #245: the plugin tests are part of the run (installed_designer_plugin is not: it checks the run path of
          # the installed plugin, which Windows does not have; see tests/CMakeLists.txt)
          ctest --test-dir build -C Release -N | grep -E 'tst_DesignerPlugin' || { echo "::error::tst_DesignerPlugin is not a test of this build"; exit 1; }
          # #274: the fonts of the step above
          test -n "${QT_QPA_FONTDIR:-}" || { echo "::error::QT_QPA_FONTDIR is not set"; exit 1; }
          # #274: the whole output of the tests (ctest -V) goes to a log, so that tools/ci_skips.py checks every skip
          # against tests/expected_skips.json; the console gets the result of each test, and the output of the
          # failing ones
          log="$RUNNER_TEMP/ctest.log"
          status=0
          ctest --test-dir build -C Release -V > "$log" 2>&1 || status=$?
          grep -E '^ *[0-9]+/[0-9]+ Test +#|tests passed|tests failed' "$log" || true
          if [ "$status" -ne 0 ]; then
            ctest --test-dir build -C Release --rerun-failed --output-on-failure || true
            exit 1
          fi
          python tools/ci_skips.py --platform "windows ci" "$log"

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log-windows-ci
          path: ${{ runner.temp }}/ctest.log
          retention-days: 14

  # ============================================================
  # 3. macOS (AppleClang & Qt 6)
  # ============================================================
  build-macos:
    name: macOS (AppleClang, Qt 6)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt via Homebrew
        run: |
          brew install qt

      # Warnings are errors here too (#215), except deprecations: Homebrew's Qt is updated without any change in
      # the repository, and this job is a required check, so a new deprecation in a later Qt would block every pull
      # request. Deprecations stay visible as warnings in the log; every other category is an error.
      - name: Configure CMake
        run: |
          set -o pipefail
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_CXX_FLAGS="-Wno-error=deprecated-declarations" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_DESIGNER_PLUGIN=ON | tee configure.log
          # The test of the installed Designer plugin (#127) runs only when the plugin is built
          grep -q "QtIndustrialWidgets: Qt Designer found, building designer plugin" configure.log

      - name: Build all targets
        run: cmake --build build

      - name: Run unit tests (QtTest)
        run: |
          export QT_QPA_PLATFORM=offscreen
          # #274: the whole output of the tests (ctest -V) goes to a log, so that tools/ci_skips.py checks every skip
          # against tests/expected_skips.json; the console gets the result of each test, and the output of the
          # failing ones
          log="$RUNNER_TEMP/ctest.log"
          status=0
          ctest --test-dir build -V > "$log" 2>&1 || status=$?
          grep -E '^ *[0-9]+/[0-9]+ Test +#|tests passed|tests failed' "$log" || true
          if [ "$status" -ne 0 ]; then
            ctest --test-dir build --rerun-failed --output-on-failure || true
            exit 1
          fi
          python3 tools/ci_skips.py --platform "macos ci" "$log"

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log-macos-ci
          path: ${{ runner.temp }}/ctest.log
          retention-days: 14

  # ============================================================
  # 4. Deploy Documentation to GitHub Pages (Main branch only)
  # ============================================================
  deploy-pages:
    name: Deploy Docs to GitHub Pages
    needs: build-linux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Pages site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./public

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
