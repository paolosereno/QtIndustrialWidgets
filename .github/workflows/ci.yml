name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================
  # 0. REUSE / SPDX Compliance Check
  # ============================================================
  reuse-compliance:
    name: REUSE Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6

  # ============================================================
  # 1. Linux (Ubuntu 24.04 LTS - GCC & Qt 6)
  # ============================================================
  build-linux:
    name: Linux (Ubuntu 24.04, GCC, Qt 6)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            doxygen \
            graphviz

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_DESIGNER_PLUGIN=ON

      - name: Build all targets
        run: cmake --build build

      - name: Run unit tests (QtTest)
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure

      - name: Build Doxygen documentation
        run: cmake --build build --target docs

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-documentation
          path: build/docs/html/
          retention-days: 14

  # ============================================================
  # 2. Windows (MSVC 2022 & Qt 6)
  # ============================================================
  build-windows:
    name: Windows (MSVC 2022, Qt 6)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_DOCS=OFF `
            -DBUILD_TESTS=ON `
            -DBUILD_EXAMPLES=ON `
            -DBUILD_DESIGNER_PLUGIN=OFF

      - name: Build all targets
        run: cmake --build build --config Release

      - name: Run unit tests (QtTest)
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build -C Release --output-on-failure

      # TEMP (#31): diagnose tst_LinearGauge on Windows. Remove this step before merging.
      - name: TEMP diagnose tst_LinearGauge
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Join-Path $PWD 'build\bin\Release\tst_LinearGauge.exe'
          if (-not (Test-Path $exe)) { Write-Host "not found: $exe"; exit 0 }

          function Invoke-Test([string[]] $testArgs) {
            $out = & $exe @testArgs 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            Write-Host ("exit code: {0} (0x{1:X8})" -f $code, $code)
            return $out
          }

          Write-Host '===== tst_LinearGauge.exe -functions'
          $list = Invoke-Test @('-functions')
          $functions = $list -split "`r?`n" | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -match '^\w+\(\)$' } | ForEach-Object { $_ -replace '\(\)$', '' }

          foreach ($scale in @('unset', '1')) {
            if ($scale -eq 'unset') { Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue }
            else { $env:QT_SCALE_FACTOR = $scale }
            foreach ($f in $functions) {
              Write-Host "===== tst_LinearGauge.exe $f -v1 (QT_SCALE_FACTOR=$scale)"
              Invoke-Test @($f, '-v1') | Out-Null
            }
          }
          exit 0

  # ============================================================
  # 3. macOS (AppleClang & Qt 6)
  # ============================================================
  build-macos:
    name: macOS (AppleClang, Qt 6)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt via Homebrew
        run: |
          brew install qt

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_DESIGNER_PLUGIN=OFF

      - name: Build all targets
        run: cmake --build build

      - name: Run unit tests (QtTest)
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure

      # TEMP (#31): diagnose LinearGauge label clipping on macOS. Remove this step and
      # ci-temp/ before merging.
      - name: TEMP diagnose LinearGauge label clipping
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S ci-temp/clipdiag -B build-clipdiag -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" || exit 0
          cmake --build build-clipdiag || exit 0
          for scale in 1 1.5; do
            echo "===== clipdiag QT_SCALE_FACTOR=$scale"
            QT_SCALE_FACTOR=$scale ./build-clipdiag/clipdiag
            echo "exit code: $?"
          done
          exit 0

  # ============================================================
  # 4. Deploy Documentation to GitHub Pages (Main branch only)
  # ============================================================
  deploy-pages:
    name: Deploy Docs to GitHub Pages
    needs: build-linux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: doxygen-documentation
          path: ./public

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
