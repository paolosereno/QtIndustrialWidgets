name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  # A manual run checks the whole pipeline on a branch (#220). The steps with an external effect run only on a v* tag
  # (see "Create Official GitHub Release"); everything else, packages and workflow artifacts included, runs as on a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. Package Linux (.deb & .tar.gz) + SPDX SBOM
  # ============================================================
  package-linux:
    name: Package Linux (DEB & TGZ)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify REUSE Compliance
        uses: fsfe/reuse-action@v6
        with:
          args: lint

      - name: Generate SPDX SBOM
        uses: fsfe/reuse-action@v6
        with:
          args: spdx --creator-person "Paolo Sereno <pablitos1024@gmail.com>" --output QtIndustrialWidgets-${{ github.ref_name }}-SBOM.spdx

      # The same script builds the packages that the deb job of linux-packages.yml checks (#133)
      - name: Build the Linux packages (DEB & TGZ)
        run: tools/package_linux.sh --install-deps .

      - name: Upload Linux Packages & SBOM
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-linux
          path: |
            QtIndustrialWidgets-${{ github.ref_name }}-SBOM.spdx
            *.deb
            *.tar.gz

  # ============================================================
  # 2. Package Windows (.zip)
  # ============================================================
  package-windows:
    name: Package Windows (ZIP)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_DOCS=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_DESIGNER_PLUGIN=OFF

      - name: Build Library
        run: cmake --build build --config Release

      - name: Create CPack Package (ZIP)
        run: cpack --config build/CPackConfig.cmake -G ZIP -C Release

      - name: Upload Windows Package
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows
          path: "*.zip"

  # ============================================================
  # 3. Publish GitHub Release with All Assets
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [package-linux, package-windows]
    runs-on: ubuntu-24.04

    steps:
      - name: Download Linux Assets & SBOM
        uses: actions/download-artifact@v8
        with:
          name: release-assets-linux
          path: ./dist

      - name: Download Windows Assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets-windows
          path: ./dist

      # The only step with an external effect: it publishes the release, uploads the packages and the SBOM as its
      # assets and creates the tag if it is missing. It runs only on a v* tag, whatever the event (#220); a manual run
      # started on an existing v* tag therefore publishes to that tag's release.
      - name: Create Official GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          files: ./dist/*
          generate_release_notes: true
