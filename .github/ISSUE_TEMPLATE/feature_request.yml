name: Feature request
description: A new feature or a change to an existing widget.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What you are trying to do and why the current widgets do not allow it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work, e.g. the property, signal or behaviour you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other solutions or workarounds you have tried.
    validations:
      required: false
  - type: dropdown
    id: widget
    attributes:
      label: Widget
      options:
        - RadialGauge
        - LinearGauge
        - SevenSegmentDisplay
        - LedIndicator
        - IndustrialKnob
        - StripChart
        - IndustrialSwitch
        - LevelMeter
        - AnnunciatorPanel
        - Compass
        - CircularBargraph
        - AnalysisChart
        - Other / build
    validations:
      required: true
